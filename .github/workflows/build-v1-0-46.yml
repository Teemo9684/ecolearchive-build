name: EcoleArchive v1.0.46 signed Windows build and publish
on:
  push:
    branches:
      - feature/gmail-live-inbox
    paths:
      - '.github/workflows/build-v1-0-46.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ecolearchive-v1-0-46-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    environment: windows-updates
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Restore reviewed assets
        shell: pwsh
        run: |
          foreach ($item in @('public/favicon.png', 'src/assets/logo-book.png', 'src/assets/heritage-original.jpg', 'src/assets/hero-school.jpg')) {
            $data = (Get-Content -Raw ($item + '.b64')).Trim()
            [System.IO.File]::WriteAllBytes((Join-Path (Get-Location) $item),[Convert]::FromBase64String($data))
          }
          $school = [Convert]::FromBase64String((Get-Content 'src/assets/school-logo.png.b64' -Raw).Trim())
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($school)).ToLowerInvariant()
          if ($hash -ne 'e041842461eb767242d564e2119311c16c3239c1ca17fbf1444273d9f45f760d') { throw 'School logo checksum mismatch' }
          [IO.File]::WriteAllBytes((Join-Path (Get-Location) 'src/assets/school-logo.png'),$school)
      - name: Generate gold-only mask
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          if ($LASTEXITCODE -ne 0) { throw 'Pillow installation failed' }
          python scripts/generate-gold-mask.py
          if ($LASTEXITCODE -ne 0) { throw 'Logo mask failed' }
      - name: Check installer version and signing configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $npm = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path desktop/src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($npm -ne '1.0.46' -or $tauri -ne '1.0.46' -or $cargo -ne '1.0.46') { throw 'Inconsistent release versions' }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing signing private key' }
      - name: Install dependencies and run frontend tests
        shell: pwsh
        run: |
          bun install
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }
          bun run test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed' }
      - name: Build Windows frontend
        run: bun run desktop:build
      - name: Restore NSIS Windows icons
        run: bunx @tauri-apps/cli@2 icon src/assets/logo-book.png --output desktop/src-tauri/icons
      - name: Run native Rust regression tests
        shell: pwsh
        run: |
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib
          if ($LASTEXITCODE -ne 0) { throw 'Native tests failed' }
      - name: Build signed NSIS setup
        shell: pwsh
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bunx @tauri-apps/cli@2 build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Signed NSIS build failed' }
      - name: Prepare updater package and manifest
        shell: pwsh
        run: |
          node desktop/updates/prepare-release.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Update manifest creation failed' }
          $dir = 'desktop/update-release'
          $exe = Join-Path $dir 'EcoleArchive-1.0.46-x64-setup.exe'
          if (-not (Test-Path $exe) -or (Get-Item $exe).Length -lt 1000000) { throw 'Installer not found or too small' }
          if (-not (Test-Path ($exe + '.sig'))) { throw 'Installer signature missing' }
          $manifest = Get-Content (Join-Path $dir 'latest.json') -Raw | ConvertFrom-Json
          if ($manifest.version -ne '1.0.46') { throw 'Wrong manifest version' }
      - uses: actions/upload-artifact@v4
        with:
          name: EcoleArchive-1.0.46-signed
          path: desktop/update-release/
          retention-days: 30
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: windows-updates
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EcoleArchive-1.0.46-signed
          path: release
      - name: Validate signed release contents before publication
        shell: bash
        run: |
          set -euo pipefail
          test -s release/EcoleArchive-1.0.46-x64-setup.exe
          test -s release/EcoleArchive-1.0.46-x64-setup.exe.sig
          test -s release/latest.json
          node -e '
          const fs=require("fs");
          const m=JSON.parse(fs.readFileSync("release/latest.json","utf8"));
          const signature=fs.readFileSync("release/EcoleArchive-1.0.46-x64-setup.exe.sig","utf8").trim();
          const p=m.platforms?.["windows-x86_64"];
          if(m.version!=="1.0.46" || !p || p.signature!==signature ||
             p.url!=="https://github.com/Teemo9684/ecolearchive-updates/releases/download/v1.0.46/EcoleArchive-1.0.46-x64-setup.exe" || signature.length<50) process.exit(1);
          '
          sha256sum release/*
      - name: Create and publish version only after successful build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "Missing release token"; exit 1; }
          REPO=Teemo9684/ecolearchive-updates
          if gh release view v1.0.46 -R "$REPO" >/dev/null 2>&1; then
            echo "Release v1.0.46 already exists; refusing to overwrite"; exit 1
          fi
          gh release create v1.0.46 release/EcoleArchive-1.0.46-x64-setup.exe release/EcoleArchive-1.0.46-x64-setup.exe.sig release/latest.json -R "$REPO" --draft --title 'EcoleArchive v1.0.46' --notes 'تحسين الأرشيف الرقمي والتصنيفات والمعاينة والنسخ الاحتياطي التلقائي والاسترجاع الآمن.'
          gh release view v1.0.46 -R "$REPO" --json isDraft,assets | jq -e '.isDraft == true and ([.assets[].name] | (index("EcoleArchive-1.0.46-x64-setup.exe") != null and index("EcoleArchive-1.0.46-x64-setup.exe.sig") != null and index("latest.json") != null))'
          gh release edit v1.0.46 -R "$REPO" --draft=false --latest
          gh release view v1.0.46 -R "$REPO" --json isDraft,url,assets | jq -e '.isDraft == false'
