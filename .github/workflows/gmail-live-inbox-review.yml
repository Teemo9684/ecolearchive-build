name: Gmail live inbox Windows verification (no release)
on:
  push:
    branches:
      - feature/gmail-live-inbox
    paths:
      - 'desktop/src-tauri/src/**'
      - 'desktop/src-tauri/Cargo.toml'
      - 'src/routes/email.tsx'
      - '.github/workflows/gmail-live-inbox-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-oauth-check:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Restore logo asset for native Windows resource
        shell: pwsh
        run: |
          $data = (Get-Content -Raw 'src/assets/logo-book.png.b64').Trim()
          [IO.File]::WriteAllBytes((Join-Path (Get-Location) 'src/assets/logo-book.png'),[Convert]::FromBase64String($data))
      - name: Generate Windows resource icons
        shell: pwsh
        run: bunx @tauri-apps/cli@2 icon src/assets/logo-book.png --output desktop/src-tauri/icons
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Prepare Tauri frontend directory for Rust-only verification
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop-web-dist | Out-Null
          Set-Content -Path desktop-web-dist/index.html -Value '<!doctype html><html><body>OAuth test</body></html>'
      - name: Restore reviewed binary assets
        shell: pwsh
        run: |
          foreach ($item in @('public/favicon.png', 'src/assets/logo-book.png', 'src/assets/heritage-original.jpg', 'src/assets/hero-school.jpg')) {
            $encoded = Get-Content -Raw ($item + '.b64')
            $bytes = [Convert]::FromBase64String($encoded.Trim())
            [System.IO.File]::WriteAllBytes((Join-Path (Get-Location) $item), $bytes)
          }
          $logoBytes = [Convert]::FromBase64String((Get-Content 'src/assets/school-logo.png.b64' -Raw).Trim())
          $sha = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($logoBytes)).ToLowerInvariant()
          if ($sha -ne 'e041842461eb767242d564e2119311c16c3239c1ca17fbf1444273d9f45f760d') { throw 'Original Lovable logo SHA256 mismatch' }
          [System.IO.File]::WriteAllBytes((Join-Path (Get-Location) 'src/assets/school-logo.png'), $logoBytes)
      - name: Generate gold-only mask for approved homepage logo
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          if ($LASTEXITCODE -ne 0) { throw 'Pillow installation failed' }
          python scripts/generate-gold-mask.py
          if ($LASTEXITCODE -ne 0) { throw 'Gold mask generation failed' }
      - name: Bundle desktop frontend
        shell: pwsh
        run: |
          bun install
          bun run desktop:build
      - name: Verify native Google OAuth client compiles on Windows
        shell: pwsh
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml
      - name: Run OAuth unit tests
        shell: pwsh
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib
