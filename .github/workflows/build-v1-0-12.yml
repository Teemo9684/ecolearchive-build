name: Build signed EcoleArchive v1.0.12 candidate
on:
  push:
    branches:
      - feature/v1-0-12-gold-only-shine
    paths:
      - 'src/**'
      - 'desktop/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/build-v1-0-12.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-windows-candidate:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: oven-sh/setup-bun@v2
      - name: Restore reviewed binary assets
        shell: pwsh
        run: |
          foreach ($item in @('public/favicon.png', 'src/assets/logo-book.png', 'src/assets/heritage-original.jpg', 'src/assets/hero-school.jpg')) {
            $encoded = Get-Content -Raw ($item + '.b64')
            $bytes = [Convert]::FromBase64String($encoded.Trim())
            [System.IO.File]::WriteAllBytes((Join-Path (Get-Location) $item), $bytes)
          }
          $logoBytes = [Convert]::FromBase64String((Get-Content 'src/assets/school-logo.png.b64' -Raw).Trim())
          $sha = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($logoBytes)).ToLowerInvariant()
          if ($sha -ne 'e041842461eb767242d564e2119311c16c3239c1ca17fbf1444273d9f45f760d') { throw 'Original Lovable logo SHA256 mismatch' }
          [System.IO.File]::WriteAllBytes((Join-Path (Get-Location) 'src/assets/school-logo.png'), $logoBytes)
      - name: Generate gold-only mask for approved homepage logo
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          if ($LASTEXITCODE -ne 0) { throw 'Pillow installation failed' }
          python scripts/generate-gold-mask.py
          if ($LASTEXITCODE -ne 0) { throw 'Gold mask generation failed' }
      - name: Check release version consistency
        shell: pwsh
        run: |
          $npm = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path desktop/src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($npm -ne "1.0.12" -or $tauri -ne "1.0.12" -or $cargo -ne "1.0.12") { throw "Version mismatch" }
      - name: Install dependencies
        run: bun install
      - name: Test archive with machine-readable diagnostics
        shell: pwsh
        run: |
          bunx vitest run --reporter=default --reporter=junit --outputFile.junit=vitest-results.xml
          if ($LASTEXITCODE -ne 0) { throw "Archive tests failed; see test report artifact and this job log." }
      - name: Preserve test diagnostics even if tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EcoleArchive-1.0.12-vitest-results
          path: vitest-results.xml
          if-no-files-found: warn
      - name: Build offline frontend
        run: bun run desktop:build
      - name: Compile desktop Rust
        working-directory: desktop/src-tauri
        run: cargo check
      - name: Validate updater signing configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "Missing Tauri signing key; refusing unsigned build." }
      - name: Build signed Windows installer
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bunx @tauri-apps/cli@2 build --bundles nsis
      - name: Prepare signed updater manifest
        run: node desktop/updates/prepare-release.mjs
      - name: Verify installer, signature, and manifest
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*1.0.12*.exe)
          if ($exe.Count -ne 1 -or $exe[0].Length -lt 1000000) { throw "Expected one non-empty 1.0.12 installer" }
          $sig = $exe[0].FullName + ".sig"
          if (-not (Test-Path $sig) -or -not (Test-Path desktop/update-release/latest.json)) { throw "Missing updater signing artifacts" }
          $manifest = Get-Content desktop/update-release/latest.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne "1.0.12") { throw "Invalid manifest version" }
      - uses: actions/upload-artifact@v4
        with:
          name: EcoleArchive-1.0.12-signed-candidate
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            desktop/update-release/latest.json
          if-no-files-found: error
          retention-days: 30
