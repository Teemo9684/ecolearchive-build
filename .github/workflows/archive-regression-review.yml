name: Archive regression verification (no release)
on:
  push:
    branches:
      - feature/gmail-live-inbox
    paths:
      - 'src/lib/services/archive*.ts'
      - 'src/lib/services/correspondenceArchive.ts'
      - 'src/lib/services/documents.ts'
      - 'src/components/app/DocumentTable.tsx'
      - 'src/components/app/documents.tsx'
      - 'src/routes/archive.tsx'
      - 'src/routes/settings.tsx'
      - 'src/components/app/AppShell.tsx'
      - 'src/lib/db/types.ts'
      - '.github/workflows/archive-regression-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-check:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Restore frontend binary assets
        shell: pwsh
        run: |
          foreach ($item in @('public/favicon.png', 'src/assets/logo-book.png', 'src/assets/heritage-original.jpg', 'src/assets/hero-school.jpg')) {
            $encoded = Get-Content -Raw ($item + '.b64')
            [System.IO.File]::WriteAllBytes((Join-Path (Get-Location) $item),[Convert]::FromBase64String($encoded.Trim()))
          }
          $logoBytes = [Convert]::FromBase64String((Get-Content 'src/assets/school-logo.png.b64' -Raw).Trim())
          $sha = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($logoBytes)).ToLowerInvariant()
          if ($sha -ne 'e041842461eb767242d564e2119311c16c3239c1ca17fbf1444273d9f45f760d') { throw 'Original logo integrity mismatch' }
          [System.IO.File]::WriteAllBytes((Join-Path (Get-Location) 'src/assets/school-logo.png'), $logoBytes)
      - name: Generate required gold mask
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          if ($LASTEXITCODE -ne 0) { throw 'Pillow install failed' }
          python scripts/generate-gold-mask.py
          if ($LASTEXITCODE -ne 0) { throw 'Logo mask generation failed' }
      - name: Install JavaScript dependencies
        run: bun install
      - name: Run complete frontend regression suite
        run: bun run test
      - name: Bundle Windows frontend without releasing an installer
        run: bun run desktop:build
