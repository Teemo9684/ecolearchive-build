name: Publish verified v1.0.1 draft

on:
  push:
    branches: [feature/official-v1-0-0-candidate]
    paths:
      - '.release-requests/publish-v1.0.1.txt'

permissions:
  contents: read

jobs:
  publish_verified_draft:
    if: github.repository == 'Teemo9684/ecolearchive-build'
    runs-on: ubuntu-latest
    environment: windows-updates
    steps:
      - uses: actions/checkout@v4
      - name: Confirm explicit request and validate draft assets
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(<.release-requests/publish-v1.0.1.txt)" = "PUBLISH_V1.0.1_APPROVED"
          test -n "${GH_TOKEN:-}" || { echo "::error::Missing GH_RELEASE_TOKEN"; exit 1; }
          gh release view v1.0.1 -R Teemo9684/ecolearchive-updates --json isDraft,assets > release.json
          jq -e '(.isDraft == true or .isDraft == false)' release.json
          jq -e '([.assets[].name] | index("EcoleArchive-1.0.1-x64-setup.exe") != null and index("EcoleArchive-1.0.1-x64-setup.exe.sig") != null and index("latest.json") != null)' release.json
          mkdir draft
          gh release download v1.0.1 -R Teemo9684/ecolearchive-updates --dir draft -p latest.json -p 'EcoleArchive-1.0.1-x64-setup.exe' -p 'EcoleArchive-1.0.1-x64-setup.exe.sig'
          test "$(jq -r .version draft/latest.json)" = "1.0.1"
          test "$(jq -r '.platforms["windows-x86_64"].signature' draft/latest.json)" = "$(cat draft/EcoleArchive-1.0.1-x64-setup.exe.sig)"
          sha256sum draft/EcoleArchive-1.0.1-x64-setup.exe
      - name: Publish ONLY v1.0.1
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          status=$(gh release view v1.0.1 -R Teemo9684/ecolearchive-updates --json isDraft,url)
          if [ "$(echo "$status" | jq -r .isDraft)" = "true" ]; then
            gh release edit v1.0.1 -R Teemo9684/ecolearchive-updates --draft=false --latest
          fi
          gh release view v1.0.1 -R Teemo9684/ecolearchive-updates --json isDraft,url
          test "$(gh release view v1.0.1 -R Teemo9684/ecolearchive-updates --json isDraft | jq -r .isDraft)" = "false"
          echo "v1.0.1 release published and verified"
